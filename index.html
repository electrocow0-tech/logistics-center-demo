<!doctype html>
<html lang="ru">
<head>
<style>html,body{background:#eef1f5;margin:0}.fl body{visibility:hidden}</style>
<script>document.documentElement.classList.add("fl")</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Центр логистики · прототип</title>
<link rel="preload" href="fonts/geologica-cyrillic-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/geologica-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css?v=07ecaaa19d">
<link rel="stylesheet" href="css/app.css?v=07ecaaa19d">
<script>/* страница показывается, когда шрифт загружен: без подмены шрифта и сдвигов */(function(d){var done=function(){window.__fr=1;if(window.__ar)d.classList.remove("fl")};if(document.fonts&&document.fonts.load){Promise.all(["400 14px Geologica","700 14px Geologica"].map(function(f){return document.fonts.load(f,"АБВабвABCabc0123")})).then(done,done)}else{done()}setTimeout(function(){d.classList.remove("fl")},1800)})(document.documentElement)</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mk" id="brandMark"></span>Центр логистики<small>прототип</small></div>
  <div class="tb-roles"><span>Компьютер:</span><div class="seg two" id="deskRoles"><button type="button" data-act="deskRole" data-role="admin"><b>Администратор</b><small>Рамиль: видит всё, деньги, отчёты</small></button><button type="button" data-act="deskRole" data-role="manager"><b>Менеджер в России</b><small>клиенты, отправки, трек-номера</small></button></div></div>
  <div class="tb-right">
    <button class="btn" type="button" data-act="scnOpen" id="btnScn"></button>
    <button class="btn ghost" type="button" data-act="reset" id="btnReset"></button>
  </div>
</header>

<main class="stage">
  <section class="desk" aria-label="Экран компьютера">
    <div class="chrome"><i></i><i></i><i></i><span class="url" id="deskUrl"></span><span class="who" id="deskWho"></span></div>
    <div class="app">
      <aside class="side"><div class="view" id="side"></div></aside>
      <div class="main" id="deskScroll"><div class="view" id="deskView"></div></div>
      <div class="dim" id="deskDim" data-act="closeDesk"></div>
      <div class="drawer" id="drawer"></div>
      <div class="modal" id="modal"></div>
    </div>
  </section>

  <section class="pcol" aria-label="Экран телефона">
    <div class="seg light two" id="phoneRoles"><button type="button" data-act="phoneRole" data-role="warehouse"><b>Склад</b><small>Китай, приёмка</small></button><button type="button" data-act="phoneRole" data-role="client"><b>Клиент<span class="dot" id="clientDot"></span></b><small>свои грузы</small></button><button type="button" data-act="phoneRole" data-role="admin"><b>Админ</b><small>Рамиль</small></button></div>
    <div class="phone">
      <div class="screen">
        <div class="sbar"><span id="clock">9:41</span><span class="ind"><svg width="17" height="11" viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx="1" fill="#0f1b2d"/><rect x="4.6" y="5" width="3" height="6" rx="1" fill="#0f1b2d"/><rect x="9.2" y="2.6" width="3" height="8.4" rx="1" fill="#0f1b2d"/><rect x="13.8" y="0" width="3" height="11" rx="1" fill="#0f1b2d"/></svg><span class="bat"></span></span></div>
        <div class="push" id="push" data-act="pushOpen"></div>
        <div class="pview" id="phoneScroll"><div class="view" id="phoneView"></div></div>
        <nav class="ptabs" id="ptabs"></nav>
        <div class="pdim" id="pdim" data-act="closeSheet"></div>
        <div class="psheet" id="psheet"></div>
      </div>
    </div>
    <div class="pcap" id="pcap"></div>
  </section>
</main>
<footer class="dock" aria-label="Сценарий"><div class="view dock-in" id="dock"></div></footer>
<div class="ov" id="ov"><div class="card" id="ovCard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/util.js?v=07ecaaa19d"></script>
<script src="js/store.js?v=07ecaaa19d"></script>
<script src="js/desk.js?v=07ecaaa19d"></script>
<script src="js/phone.js?v=07ecaaa19d"></script>
<script src="js/scenario.js?v=07ecaaa19d"></script>
<script src="js/main.js?v=07ecaaa19d"></script>
</body>
</html>
